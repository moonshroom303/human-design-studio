<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232B45A6' stroke-width='2'/%3E%3Cpath d='M16 6 L24 16 L16 26 Z' fill='%23C1272D'/%3E%3Cpath d='M16 6 L8 16 L16 26 Z' fill='%23171A26'/%3E%3C/svg%3E">
<style>:root {
  --paper: #E9EDF3; --surface: #F7F9FC; --surface-2: #DDE4EE; --ink: #171A26; --muted: #556074; --line: #C4CCD9;
  --accent: #2B45A6; --accent-ink: #fff; --design: #C1272D; --pers: #171A26; --gold: #A0700F; --transit: #12826A;
  --a: #2A6FDB; --b: #C2397A; --ok: #2E7D4F; --warn: #A0700F; --err: #B3261E;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --glyph: "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Noto Sans Symbols", "Noto Sans Symbols 2", sans-serif;
  --r-s: 7px; --r-m: 14px; --maxw: 1180px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
[data-theme="dark"] {
  --paper: #0C1225; --surface: #131B34; --surface-2: #1B2546; --ink: #E5E8F1; --muted: #8F98B3; --line: #2A3559;
  --accent: #93A8FF; --accent-ink: #0C1225; --design: #FF5D63; --pers: #EEF0F6; --gold: #E3B65C; --transit: #45D0A4;
  --a: #62A0FF; --b: #F06DAA; --ok: #5BC48A; --warn: #E3B65C; --err: #FF7A73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; transition: background-color .25s, color .25s; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.005em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.6rem; } h3 { font-size: 1.22rem; } h4 { font-size: 1.02rem; }
p { margin: 0 auto .8em; max-width: 70ch; }
a { color: var(--accent); }
.glyph { font-family: var(--glyph); font-variant-emoji: text; }
.num { font-family: var(--serif); font-variant-numeric: lining-nums tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.design-c { color: var(--design); } .gold-c { color: var(--gold); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Kopfbereich ---------- */
.top { padding: calc(20px + var(--safe-t)) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l)); border-bottom: 1px solid var(--line); }
.top-in { max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.brand { display: inline-flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; letter-spacing: .005em; }
.navrow { display: flex; align-items: center; justify-content: center; gap: 4px 18px; flex-wrap: wrap; }
.nav { display: flex; justify-content: center; flex-wrap: wrap; }
.nav a { display: flex; align-items: center; gap: 7px; padding: 10px 11px 13px; color: var(--muted); text-decoration: none; font-size: .95rem; box-shadow: inset 0 -2px 0 transparent; }
.nav svg, .themes svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .l-short { display: none; }
.themes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; margin-bottom: 4px; background: var(--surface); }
.themes button { border: 0; border-radius: 999px; background: transparent; padding: 5px 12px; color: var(--muted); font-size: .86rem; gap: 6px; }
.themes button svg { width: 16px; height: 16px; }
.themes button:hover { color: var(--ink); border: 0; }
.themes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
main { max-width: var(--maxw); margin: 0 auto; padding: 34px calc(clamp(14px, 3vw, 36px) + var(--safe-r)) 60px calc(clamp(14px, 3vw, 36px) + var(--safe-l)); text-align: center; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 36px; margin: 0 auto; }

@media (min-width: 761px) and (max-width: 1060px) {
  .top-in { position: relative; }
  .themes { position: absolute; right: 0; top: 2px; margin: 0; }
  .nav .l-long { display: none; } .nav .l-short { display: inline; }
}
@media (max-width: 760px) {
  .top { position: sticky; top: 0; z-index: 40; padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l)); background: var(--paper); }
  .top-in { flex-direction: row; justify-content: center; position: relative; min-height: 34px; }
  .brand svg { width: 28px; height: 28px; }
  .brand b { font-size: 1.08rem; }
  .navrow { position: static; }
  .themes { position: absolute; right: 0; top: 50%; transform: translateY(-50%); margin: 0; }
  .themes button { padding: 5px 8px; }
  .themes .tl { display: none; }
  .nav { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(7, 1fr); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 4px calc(2px + var(--safe-r)) calc(4px + var(--safe-b)) calc(2px + var(--safe-l)); }
  .nav a { flex-direction: column; gap: 3px; padding: 6px 0 4px; font-size: .66rem; box-shadow: none; min-width: 0; }
  .nav a svg { width: 23px; height: 23px; }
  .nav .l-long { display: none; } .nav .l-short { display: block; white-space: nowrap; }
  .nav a[aria-current="page"] { color: var(--accent); box-shadow: none; }
  main { padding-top: 22px; padding-bottom: 30px; }
  .foot { padding-bottom: calc(86px + var(--safe-b)); }
  #toast { bottom: calc(80px + var(--safe-b)) !important; }
}
@media (max-width: 360px) { .brand b { font-size: .98rem; } }

/* ---------- Bedienelemente ---------- */
button, .btn { font: inherit; cursor: pointer; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.ghost, .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover, .btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
button.danger { color: var(--err); }
button.danger-fill { background: var(--err); border-color: var(--err); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
label.f { display: block; font-size: .86rem; color: var(--muted); margin-bottom: 14px; }
label.f > span { display: block; margin-bottom: 5px; }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=datetime-local], input[type=search], select, textarea {
  font: inherit; font-size: max(16px, 1em); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 9px 11px; width: 100%; min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
input[type=date], input[type=time], input[type=datetime-local] { -webkit-appearance: none; appearance: none; display: block; }
textarea { min-height: 200px; resize: vertical; line-height: 1.5; text-align: left; }
input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
input[type=search].filter { max-width: 440px; display: block; margin: 0 auto 14px; }
.check { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: .93rem; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.toolbar label.f { margin: 0; text-align: center; }
.toolbar label.f.w { min-width: 220px; }

/* ---------- Start ---------- */
.hero h1 { font-size: clamp(2.1rem, 4.4vw, 3.1rem); margin-bottom: .25em; }
.hero .lede { color: var(--muted); font-size: 1.06rem; max-width: 50ch; margin-bottom: 30px; }
.home-grid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 440px); gap: clamp(24px, 5vw, 76px); justify-content: center; align-items: start; }
.formcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 24px 22px 20px; }
.sky h2 { margin-bottom: .2em; }
.sky .sky-type { font-family: var(--serif); font-size: 1.12rem; margin-bottom: 4px; }
.sky .sky-when { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
.sky .bgwrap { max-width: 400px; margin: 0 auto; }
.nowcircle { margin: 56px auto 0; padding-top: 40px; border-top: 1px solid var(--line); }
.nowcircle .lede { color: var(--muted); max-width: 52ch; }
.nowinfo { max-width: 760px; margin: 18px auto 0; }
.nowinfo .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.nowinfo .pair > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; }
.nowinfo .big { font-family: var(--serif); font-size: 1.9rem; line-height: 1.1; }
.nowinfo .big .glyph { font-size: 1.3rem; color: var(--transit); margin-right: 4px; }
.nowinfo h4 { margin: 18px 0 8px; }
.install-link { margin-top: 36px; }
@media (max-width: 860px) { .home-grid { grid-template-columns: minmax(0, 480px); } }
@media (max-width: 520px) { .nowinfo .pair { grid-template-columns: 1fr; } }
.place-box { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); margin-top: 4px; max-height: 300px; overflow: auto; box-shadow: 0 12px 30px rgba(10, 20, 50, .2); text-align: left; }
.suggest button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 10px 12px; }
.suggest button:hover, .suggest button.on { background: var(--surface-2); }
.suggest small { color: var(--muted); }
.preview { font-size: .86rem; color: var(--muted); border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin: -4px 0 16px; }
.preview:empty { display: none; }
.preview.warn { color: var(--warn); border-color: var(--warn); }
.preview.err { color: var(--err); border-color: var(--err); }
details.adv > summary { cursor: pointer; color: var(--muted); font-size: .88rem; margin-bottom: 12px; }
.formcard .row { justify-content: flex-start; }
.recent { margin-top: 28px; text-align: left; }
.recent h3 { text-align: center; }
.recent a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.recent a:hover b { text-decoration: underline; }

/* ---------- Chart ---------- */
.chead { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 20px; }
.chead h1 { margin: 0; font-size: clamp(1.9rem, 3.6vw, 2.7rem); }
.chead .meta { color: var(--muted); font-size: .9rem; }
.banner { border: 1px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); padding: 10px 14px; border-radius: var(--r-s); margin: 0 auto 18px; font-size: .92rem; max-width: 880px; }
.typeline { margin: 6px 0 22px; }
.typeline .t { font-family: var(--serif); font-size: clamp(1.9rem, 3.4vw, 2.6rem); line-height: 1.1; }
.typeline .muted { margin-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: 0 auto 28px; max-width: 1040px; }
@media (min-width: 1000px) { .facts { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 340px) { .facts { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .facts > div { padding: 9px 8px 11px; } .facts dd { font-size: 1rem; } }
.facts > div { padding: 11px 14px 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts dt { font-size: .78rem; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-family: var(--serif); font-size: 1.08rem; line-height: 1.3; }
.facts dd small { display: block; font-family: var(--sans); font-size: .78rem; color: var(--muted); }
.plate { display: grid; grid-template-columns: 1fr minmax(280px, 470px) 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px 10px; }
.acol h3 { font-size: 1rem; margin: 0 0 8px; padding: 0 8px; }
.acol.design h3 { color: var(--design); text-align: right; }
.acol.pers h3 { text-align: left; }
.arow { display: grid; align-items: center; gap: 8px; padding: 3px 8px; border-radius: var(--r-s); cursor: default; }
.acol.design .arow { grid-template-columns: 1fr auto 26px; text-align: right; }
.acol.pers .arow { grid-template-columns: 26px auto 1fr; text-align: left; }
.arow:hover, .arow.hl { background: var(--surface-2); }
.arow .pg { font-size: 1.15rem; text-align: center; }
.acol.design .pg, .acol.design .gl { color: var(--design); }
.acol.pers .pg, .acol.pers .gl { color: var(--pers); }
.arow .gl { font-family: var(--serif); font-size: 1.28rem; font-variant-numeric: lining-nums tabular-nums; }
.arow .ctb { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.arow .flags { font-size: .78rem; color: var(--muted); }
.arow.sens .gl { color: var(--gold) !important; text-decoration: underline dotted; text-underline-offset: 4px; }
.arow .gname { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bgwrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
@media (max-width: 980px) {
  .plate { grid-template-columns: 1fr 1fr; }
  .plate .bgcol { grid-column: 1 / -1; order: -1; max-width: 470px; margin: 0 auto; width: 100%; }
}
@media (max-width: 520px) { .arow .gname { display: none; } .plate { padding: 14px 4px; } }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 30px 0 22px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; } .tabs > :last-child { margin-right: auto; }
.tabs button { border: 0; background: none; border-radius: 0; padding: 10px 12px; color: var(--muted); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; flex: none; }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs button:hover { color: var(--ink); }
.prose { max-width: 720px; margin: 0 auto; }
.prose h3 { margin-top: 1.5em; }
.prose ul { list-style: none; padding: 0; margin: 0 0 1em; }
.prose li { margin-bottom: .4em; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 860px) { .split, .grid2 { grid-template-columns: 1fr; } }

table.t { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 0 auto; }
table.t th { font-weight: 600; color: var(--muted); font-size: .8rem; padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: center; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; text-align: center; }
table.t tr:hover td { background: var(--surface); }
table.t td.n { font-family: var(--serif); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }

.centers, .vars, .gk { display: grid; gap: 14px; justify-content: center; }
.centers { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 360px)); }
.vars { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 260px)); }
.gk { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 230px)); }
.center-item, .var, .gk > div, .panel { border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 18px; background: var(--surface); }
.center-item h4 { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2px; }
.center-item .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
.center-item.open .sw { background: transparent !important; }
.center-item .st { font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
.center-item p { font-size: .9rem; margin-bottom: .55em; }
.center-item .q { font-style: italic; color: var(--muted); }
.center-item.hl { outline: 2px solid var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: .83rem; background: var(--surface); margin: 0 3px 7px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-p, .dot-d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 2px; }
.dot-p { background: var(--pers); } .dot-d { background: var(--design); }
.var .arrow { font-size: 1.9rem; line-height: 1; font-family: var(--serif); }
.var .arrow.d { color: var(--design); }
.var h4 { margin: 6px 0 2px; }
.code { font-family: var(--serif); font-size: 1.7rem; letter-spacing: .04em; }
.gk .k { font-family: var(--serif); font-size: 2rem; line-height: 1; }
.gk .k small { font-size: .9rem; color: var(--muted); }
.gk ol { list-style: none; padding: 0; margin: 10px 0 0; font-size: .9rem; }
.gk ol li { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding: 5px 0; }
.gk ol li span { color: var(--muted); font-size: .8rem; }

.slider { width: 100%; accent-color: var(--accent); }
.explorer { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 380px); gap: 28px; align-items: start; justify-content: center; }
@media (max-width: 760px) { .explorer { grid-template-columns: minmax(0, 420px); } }
.changed { color: var(--gold); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto auto; gap: 4px 16px; font-size: .92rem; justify-content: center; text-align: left; margin: 0 auto; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

.list { max-width: 760px; margin: 0 auto; }
.list-row { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.list-row .nm { font-family: var(--serif); font-size: 1.18rem; color: inherit; text-decoration: none; }
.list-row .sub { font-size: .85rem; color: var(--muted); }
.empty { padding: 40px 0; color: var(--muted); }

.cols { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 560px); gap: 32px; align-items: start; justify-content: center; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 520px); } }
.mandala-wrap { max-width: 620px; margin: 0 auto; }
.mandala-wrap svg { width: 100%; height: auto; display: block; }
.narrow { max-width: 640px; margin: 0 auto; }
.form-narrow { max-width: 480px; margin: 0 auto; }

dialog.dlg::backdrop { background: rgba(8, 12, 30, .5); }
dialog.dlg img { max-width: 100%; max-height: 58vh; display: block; margin: 0 auto 12px; border-radius: 8px; border: 1px solid var(--line); -webkit-touch-callout: default; }

svg [data-gate], svg [data-center] { cursor: pointer; }
svg .gate.hl circle { stroke: var(--gold); stroke-width: 2.5; }

const normS = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function offlinePlaces(q) {
  let n = normS(q); if (!n) return [];
  const al = Object.entries(ALIAS).find(([k]) => k.startsWith(n) || n.startsWith(k)); const n2 = al ? normS(al[1]) : null;
  const scored = [];
  for (const c of CITIES) {
    const nm = normS(c.name);
    let s = nm.startsWith(n) ? 3 : nm.includes(n) ? 2 : (n2 && nm.startsWith(n2)) ? 3 : 0;
    if (!s && normS(c.country).startsWith(n)) s = 1;
    if (s) scored.push([s, c]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length).slice(0, 8).map(x => ({ ...x[1], src: 'offline' }));
}
let geoAbort = null;
async function onlinePlaces(q) {

    geoAbort?.abort(); geoAbort = new AbortController();
    const t = setTimeout(() => geoAbort.abort(), 5000);

    clearTimeout(t);

}

function bindForm(rec) {

    sug.innerHTML = items.map((p, i) => `<button type="button" role="option" class="${i === sel ? 'on' : ''}" data-i="${i}">${esc(p.name)} <small>${esc([p.admin, p.country].filter(Boolean).join(', '))}, ${esc(p.tz)}</small></button>`).join('');
    sug.hidden = false; inp.setAttribute('aria-expanded', 'true');
  };
  const pick = p => { place = p; inp.value = placeLabel(p); items = []; renderSug(); update(); };
  inp.addEventListener('input', () => {
    place = null; const q = inp.value; items = offlinePlaces(q); sel = -1; renderSug(); update();
    clearTimeout(deb); deb = setTimeout(async () => {
      const on = await onlinePlaces(q); if (inp.value !== q) return;
      const seen = new Set(items.map(p => normS(p.name) + '|' + p.tz));
      for (const p of on) { const k = normS(p.name) + '|' + p.tz; if (!seen.has(k) || p.admin) { items.push(p); seen.add(k); } }
      const dedup = []; const ks = new Set();
      for (const p of items) { const k = normS(p.name) + normS(p.country || '') + (p.admin || ''); if (!ks.has(k)) { ks.add(k); dedup.push(p); } }

    }

    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); renderSug(); e.preventDefault(); }

    if (r.error) { const pv = $('#f-prev'); pv.className = 'preview err'; pv.textContent = r.error; return; }

function nextGateChange(pid, ms) {
  const [step, maxDays] = { sun: [0.25, 10], moon: [0.02, 1.5], mercury: [0.25, 60], venus: [0.5, 120], mars: [1, 200] }[pid];
  const jd0 = Astro.jdFromMs(ms);
  const at = d => HD.activation(Astro.bodyLon(pid, Astro.jdeFromJdUT(jd0 + d))).gate;
  const g0 = at(0); let d = 0;
  while (d < maxDays) {
    const d2 = d + step;
    if (at(d2) !== g0) { let a = d, b = d2; for (let i = 0; i < 30; i++) { const m = (a + b) / 2; if (at(m) === g0) a = m; else b = m; } return { ms: ms + b * 86400000, from: g0, to: at(b + 1e-6) }; }
    d = d2;
  }
  return null;
}
function fmtWhen(ms) {
  const d = new Date(ms), n = new Date(); const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(n)) / 86400000);
  const t = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' }).format(d);
  if (diff === 0) return `heute, ${t} Uhr`; if (diff === 1) return `morgen, ${t} Uhr`;
  return new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }).format(d) + `, ${t} Uhr`;
}

/* ---------- Zyklen & Kalender ---------- */
function crossings(pid, target, msFrom, msTo, stepDays) {
  const f = ms => Astro.wrap180(Astro.bodyLon(pid, Astro.jdeFromJdUT(Astro.jdFromMs(ms))) - target);
  const out = []; let t = msFrom, v = f(t);
  while (t < msTo) {
    const t2 = t + stepDays * 86400000, v2 = f(t2);
    if (Math.sign(v) !== Math.sign(v2) && Math.abs(v - v2) < 90) {
      let a = t, b = t2, fa = v; for (let i = 0; i < 40; i++) { const m = (a + b) / 2, fm = f(m); if (Math.sign(fm) === Math.sign(fa)) { a = m; fa = fm; } else b = m; }
      out.push((a + b) / 2);
    }
    t = t2; v = v2;
  }
  return out;
}

    } else {
      const from = Date.now(), to = from + 29 * 86400000; const rows = [];
      const at = ms => HD.activation(Astro.moonApparent(Astro.jdeFromJdUT(Astro.jdFromMs(ms)))).gate;
      let t = from, g = at(t); rows.push([from, g, true]);
      while (t < to) {
        const t2 = t + 2 * 3600000, g2 = at(t2);
        if (g2 !== g) { let a = t, b2 = t2; for (let i = 0; i < 25; i++) { const m = (a + b2) / 2; if (at(m) === g) a = m; else b2 = m; } rows.push([b2, g2]); g = g2; }
        t = t2;
      }
      const nat = rec ? getChart(rec) : null;
      P.innerHTML = `<div class="prose"><p>Der Mond durchläuft in rund 28 Tagen alle 64 Tore. Für Reflektoren ist dieser Zyklus die Entscheidungsgrundlage; für alle anderen zeigt er die Stimmung des Tages.${nat ? ` Markiert ist, was in ${esc(rec.name)}s Chart einen Kanal oder ein Zentrum aktiviert.` : ''}</p></div>
      <div class="tablewrap"><table class="t"><thead><tr><th>Ab</th><th>Tor</th><th>Thema</th>${nat ? '<th>Wirkung</th>' : ''}</tr></thead><tbody>${rows.map(([ms, g, first]) => {
        let eff = '';
        if (nat) { const comp = (HD.GATE_PARTNERS[g] || []).filter(o => nat.activeGates.has(o) && !nat.activeGates.has(g)); const c = HD.GATE_CENTER[g];
          eff = comp.length ? `Kanal ${comp.map(o => { const ch = HD.CHANNELS.find(x => x.gates.includes(g) && x.gates.includes(o)); return ch.key + ' ' + ch.name; }).join(', ')}` : nat.activeGates.has(g) ? 'eigenes Tor' : ''; if (comp.length && !nat.defined.has(c)) eff += `, definiert ${HD.CENTERS[c].de}`; }
        return `<tr data-gate="${g}"><td class="n">${first ? 'jetzt' : fmtDay(ms) + ', ' + new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' }).format(new Date(ms))}</td><td class="n"><b>${g}</b></td><td>${esc(HD.GATE_DATA[g][0])}</td>${nat ? `<td class="small">${esc(eff)}</td>` : ''}</tr>`;
      }).join('')}</tbody></table></div>`;
    }
  };
  $$('.tabs [data-t]').forEach(b => b.onclick = () => { tab = S.cycleTab = b.dataset.t; draw(); });
  $('#y-chart')?.addEventListener('change', draw); $('#y-year').addEventListener('change', draw);
  draw();
}

/* ---------- Wissen ---------- */
const KTABS = [['types', 'Typen'], ['auth', 'Autorität'], ['profiles', 'Profile & Linien'], ['centers', 'Zentren'], ['gates', 'Die 64 Tore'], ['channels', 'Die 36 Kanäle'], ['circuits', 'Schaltkreise'], ['planets', 'Planeten'], ['calc', 'Berechnung']];
function viewKnowledge(tab) {
  if (tab) S.knowTab = tab;
  view().innerHTML = `<div class="chead"><div><h1>Wissen</h1><div class="meta">Nachschlagewerk zu allen Bausteinen des BodyGraph</div></div></div>
  <div class="tabs" role="tablist">${KTABS.map(([k, l]) => `<button data-k="${k}" aria-selected="${S.knowTab === k}">${l}</button>`).join('')}</div><div id="k-panel"></div>`;
  $$('.tabs [data-k]').forEach(b => b.onclick = () => { S.knowTab = b.dataset.k; $$('.tabs [data-k]').forEach(x => x.setAttribute('aria-selected', x === b)); drawK(); });
  drawK();
}
function drawK() {
  const P = $('#k-panel'); const k = S.knowTab;
  if (k === 'types') P.innerHTML = `<div class="prose">${Object.values(HD.TYPES).map(t => `<h3>${esc(t.de)} <span class="muted small" style="font-family:var(--sans)">${t.share}</span></h3><p>${esc(t.text)}</p><p class="small"><b>Strategie:</b> ${esc(t.strategy)}. <b>Signatur:</b> ${esc(t.signature)}. <b>Nicht-Selbst:</b> ${esc(t.notSelf)}. <b>Aura:</b> ${esc(t.aura)}.</p>`).join('')}
    <h3>Wie der Typ bestimmt wird</h3><p>Ist das Sakral definiert, bist du Generator. Führt zusätzlich ein Motor (Sakral, Solarplexus, Herz oder Wurzel) über definierte Kanäle zur Kehle, bist du Manifestierender Generator. Ohne Sakral, aber mit Motor an der Kehle: Manifestor. Ohne Sakral und ohne Motor an der Kehle, aber mit mindestens einem definierten Zentrum: Projektor. Ganz ohne Definition: Reflektor.</p></div>`;
  else if (k === 'auth') P.innerHTML = `<div class="prose"><p>Die innere Autorität folgt einer festen Rangfolge: Solarplexus vor Sakral vor Milz vor Herz vor G-Zentrum. Ist keines davon definiert, gibt es keine innere Autorität.</p>${Object.values(HD.AUTHORITIES).map(a => `<h3>${esc(a.de)}</h3><p>${esc(a.text)}</p>`).join('')}</div>`;
  else if (k === 'profiles') P.innerHTML = `<div class="prose"><h3>Die sechs Linien</h3>${Object.entries(HD.LINES).map(([n, l]) => `<p><b>${n}. ${esc(l.de)}</b> (${l.en}): ${esc(l.text)}</p>`).join('')}
    <p class="small muted">Linien 1–3 bilden das untere Trigramm (persönlich, nach innen gerichtet), Linien 4–6 das obere (transpersonal, nach außen gerichtet).</p>
    <h3>Die zwölf Profile</h3>${Object.entries(HD.PROFILES).map(([p, t]) => `<p><b>${p}</b> ${esc(t)}</p>`).join('')}
    <h3>Geometrie</h3>${Object.entries(HD.ANGLE_TEXT).map(([a, t]) => `<p><b>${HD.ANGLE_DE[a]}</b>: ${esc(t)}</p>`).join('')}</div>`;
  else if (k === 'centers') P.innerHTML = `<div class="centers">${HD.CENTER_ORDER.map(c => { const C = HD.CENTERS[c], t = HD.CENTER_TEXT[c]; return `<div class="center-item"><h4><span class="sw" style="background:${C.color}"></span>${esc(C.de)}</h4><div class="st">${esc(C.kind)}zentrum</div><p class="small muted">${esc(t.fn)}</p><p><b>Definiert:</b> ${esc(t.def)}</p><p><b>Offen:</b> ${esc(t.open)}</p><p class="q">${esc(t.q)}</p><p class="small">Tore: ${C.gates.slice().sort((a, b) => a - b).join(', ')}</p></div>`; }).join('')}</div>`;
  else if (k === 'gates') {
    P.innerHTML = `<input type="search" id="kg-q" class="filter" placeholder="Tor suchen: Nummer, Name oder Stichwort"><div class="tablewrap"><table class="t"><thead><tr><th>Tor</th><th>Name</th><th>Zentrum</th><th>Tierkreis</th><th>Kanal</th><th>Gene Key</th></tr></thead><tbody id="kg-b"></tbody></table></div>`;
    const dr = () => { const q = normS($('#kg-q').value);
      $('#kg-b').innerHTML = Array.from({ length: 64 }, (_, i) => i + 1).filter(g => !q || String(g) === q || normS(HD.GATE_DATA[g].join(' ') + ' ' + HD.GENE_KEYS[g]).includes(q)).map(g => {
        const s = HD.gateStartLon(g); return `<tr data-gate="${g}"><td class="n"><b>${g}</b></td><td><b>${esc(HD.GATE_DATA[g][0])}</b><div class="small muted">${esc(HD.GATE_DATA[g][1])}. ${esc(HD.GATE_DATA[g][2])}</div></td><td>${esc(HD.CENTERS[HD.GATE_CENTER[g]].de)}</td><td class="n small">${zodHTML(s)} – ${zodHTML(Astro.norm(s + HD.GATE_W))}</td><td class="small">${(HD.GATE_PARTNERS[g] || []).map(o => { const ch = HD.CHANNELS.find(c => c.gates.includes(g) && c.gates.includes(o)); return `${ch.key} ${esc(ch.name)}`; }).join('<br>')}</td><td class="small">${esc(HD.GENE_KEYS[g].replace(/\|/g, ' → '))}</td></tr>`; }).join(''); };
    $('#kg-q').addEventListener('input', dr); dr();
  }
  else if (k === 'channels') P.innerHTML = `<div class="tablewrap"><table class="t"><thead><tr><th>Kanal</th><th>Name</th><th>Thema</th><th>Zentren</th><th>Schaltkreis</th></tr></thead><tbody>${HD.CHANNELS.map(ch => `<tr><td class="n"><b>${ch.key}</b></td><td><b>${esc(ch.name)}</b></td><td>${esc(ch.desc)}</td><td>${ch.centers.map(c => HD.CENTERS[c].de).join(' – ')}</td><td><span class="chip"><i style="background:${HD.CIRCUITS[ch.circuit].color}"></i>${esc(HD.CIRCUITS[ch.circuit].de)}</span></td></tr>`).join('')}</tbody></table></div>`;
  else if (k === 'circuits') P.innerHTML = `<div class="prose">${Object.entries(HD.CIRCUITS).map(([key, c]) => `<h3><span class="chip"><i style="background:${c.color}"></i>${esc(c.de)}</span></h3><p>Thema: ${esc(c.theme)}.</p><p class="small">Kanäle: ${HD.CHANNELS.filter(ch => ch.circuit === key).map(ch => `${ch.key} ${esc(ch.name)}`).join(', ')}</p>`).join('')}</div>`;
  else if (k === 'planets') P.innerHTML = `<div class="prose"><p>Jeder Körper prägt das Tor, in dem er steht, mit seiner eigenen Färbung. Sonne und Erde machen zusammen etwa 70 % der Prägung aus.</p><table class="t"><tbody>${HD.PLANETS.map(p => `<tr><td>${G(p.glyph)} <b>${p.de}</b></td><td>${esc(HD.PLANET_KEYNOTE[p.id])}</td></tr>`).join('')}</tbody></table></div>`;
  else P.innerHTML = `<div class="prose"><h3>So rechnet diese App</h3>
    <p>Die Persönlichkeit wird für den Geburtsmoment berechnet. Das Design entspricht dem Moment, in dem die Sonne genau 88° vor ihrer Geburtsposition stand – das sind etwa 88 bis 89 Tage vor der Geburt.</p>
    <p>Das Rave-Mandala teilt den Tierkreis in 64 Tore zu je 5°37′30″, beginnend mit Tor 41 bei 2° Wassermann. Jedes Tor hat 6 Linien (56′15″), jede Linie 6 Farben, jede Farbe 6 Töne und jeder Ton 5 Basen.</p>
    <h3>Ephemeride und Genauigkeit</h3>
    <ul><li>Sonne und Erde: VSOP87-Reihen, Genauigkeit etwa 1″.</li><li>Mond: ELP-2000/82-Reihen (60 Terme), etwa 5–10″.</li>
    <li>Merkur, Venus, Mars, Uranus, Neptun, Pluto: Bahnelemente nach JPL (Standish), etwa 0,5–2′.</li><li>Jupiter und Saturn: Bahnelemente mit Störungstermen der großen Ungleichheit, etwa 1–3′.</li>
    <li>Mondknoten: wahrer Knoten (Standard) oder mittlerer Knoten, einstellbar.</li>
    <li>Scheinbare Positionen mit Lichtlaufzeit, Aberration, Nutation und ΔT.</li></ul>
    <p>Tor und Linie sind damit praktisch immer exakt. Farbe, Ton und Basis der Sonne sind ebenfalls präzise; bei den langsamen Planeten können Ton und Basis an Grenzen abweichen. Aktivierungen, die innerhalb der Rechengenauigkeit an einer Liniengrenze liegen, sind mit ≈ markiert.</p>
    <h3>Zeitzonen</h3><p>Die historische Zeitzone und Sommerzeit kommen aus der Zeitzonen-Datenbank deines Browsers (IANA). Bei sehr alten Daten oder Orten mit Sonderregeln kannst du einen festen Versatz eintragen. Der Ortsname wird offline gesucht; mit Internet ergänzt die App weitere Orte über Open-Meteo.</p>
    <p class="small muted">Human Design wurde 1987 von Ra Uru Hu begründet. Diese App ist ein unabhängiges Werkzeug und steht in keiner Verbindung zu Jovian Archive oder Gene Keys.</p></div>`;
}

/* ---------- Einstellungen ---------- */
let deferredInstall = null;
function platformKey() {
  const ua = navigator.userAgent;
  if (/iPhone|iPod/.test(ua)) return 'ios';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  if (/Macintosh/.test(ua)) return 'mac';
  return 'win';
}
function installSection() {
  if (isStandalone()) return `<h3 id="install">App</h3><p>Du nutzt Human Design Studio gerade als installierte App.</p>`;
  const pk = platformKey(); const you = k => k === pk ? 'you' : '';
  return `<h3 id="install">Als App installieren</h3>
  <p>Installiert bekommt Human Design Studio ein eigenes Symbol und ein eigenes Fenster und läuft auch ohne Internet.</p>
  ${deferredInstall ? `<p><button class="primary" id="s-install">App installieren</button></p>` : ''}
  ${location.protocol === 'file:' ? `<p class="banner">Du hast die App gerade als Datei geöffnet. Installieren lässt sie sich, sobald du sie über ihre Web-Adresse öffnest.</p>` : ''}
  <div class="platforms">
    <div class="${you('ios')}"><h4>iPhone und iPad</h4><ol><li>Die Web-Adresse in <b>Safari</b> öffnen.</li><li>Auf das Teilen-Symbol tippen (Quadrat mit Pfeil; im neuen Safari zuerst auf „…“).</li><li>„Zum Home-Bildschirm“ wählen, „Als Web-App öffnen“ eingeschaltet lassen und „Hinzufügen“ tippen.</li></ol></div>
    <div class="${you('android')}"><h4>Android</h4><ol><li>Die Web-Adresse in <b>Chrome</b> öffnen.</li><li>Das Menü ⋮ oben rechts antippen.</li><li>„App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen.</li></ol></div>
    <div class="${you('mac')}"><h4>Mac</h4><ol><li>In <b>Safari</b> (ab macOS Sonoma): Menü „Ablage“, dann „Zum Dock hinzufügen“.</li><li>Oder in <b>Chrome</b> bzw. <b>Edge</b>: Installieren-Symbol rechts in der Adressleiste.</li></ol></div>
    <div class="${you('win')}"><h4>Windows</h4><ol><li>Die Web-Adresse in <b>Chrome</b> oder <b>Edge</b> öffnen.</li><li>Das Installieren-Symbol rechts in der Adressleiste anklicken.</li></ol></div>
  </div>
  <p class="small muted" style="margin-top:14px">Jede Installation hat ihren eigenen Speicher. Um Charts auf ein anderes Gerät zu bringen, exportiere in der Bibliothek eine Sicherung und importiere sie dort.</p>`;
}
function viewSettings() {
  const s = S.settings;
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${s[key] === v}">${l}</button>`).join('')}</div>`;
  view().innerHTML = `<div class="narrow"><h1>Einstellungen</h1>
  <h3>Darstellung</h3><p>${seg('theme', [['system', 'Wie das Gerät'], ['light', 'Tag'], ['dark', 'Nacht']])}</p>
  <p><label class="check"><input type="checkbox" id="s-adv" ${s.advanced ? 'checked' : ''}> Farbe, Ton und Basis bei jeder Aktivierung zeigen</label></p>
  <p><label class="check"><input type="checkbox" id="s-names" ${s.showGateNames ? 'checked' : ''}> Tornamen neben den Aktivierungen zeigen</label></p>
  <h3>Berechnung</h3><p>Mondknoten ${seg('node', [['true', 'Wahrer Knoten'], ['mean', 'Mittlerer Knoten']])}</p>
  <p class="small muted">Die meisten Human-Design-Programme verwenden den wahren Knoten.</p>
  <label class="f" style="max-width:280px;margin:0 auto 14px"><span>Geburtszeit-Warnung (Minuten)</span><input type="number" id="s-sens" min="1" max="120" value="${s.sensMin}"></label>
  ${installSection()}
  <h3>Daten</h3><p>Deine Charts liegen nur im Speicher dieses Geräts. Exportiere eine Sicherung, bevor du Browserdaten löschst.</p>
  <div class="row"><a class="btn" href="#/library">Zur Bibliothek (Export / Import)</a><button class="danger" id="s-clear">Alle Charts löschen</button></div></div>`;
  $$('.seg').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; s[g.dataset.key] = b.dataset.v; saveSettings(); S.cache.clear(); S.sensCache.clear(); applyTheme(); viewSettings(); }));
  $('#s-adv').onchange = e => { s.advanced = e.target.checked; saveSettings(); };
  $('#s-names').onchange = e => { s.showGateNames = e.target.checked; saveSettings(); };
  $('#s-sens').onchange = e => { s.sensMin = Math.max(1, Math.min(120, +e.target.value || 15)); saveSettings(); };
  $('#s-install')?.addEventListener('click', async () => { const p = deferredInstall; if (!p) return; p.prompt(); try { await p.userChoice; } catch { } deferredInstall = null; viewSettings(); });
  $('#s-clear').onclick = async () => { if (await askConfirm('Wirklich alle gespeicherten Charts löschen? Das lässt sich nicht rückgängig machen.', 'Alle löschen')) { S.lib = []; saveLib(); toast('Alle Charts gelöscht'); } };
}

/* ---------- Router ---------- */
function route(keepScroll) {
  clearTimers(); $('#tip').hidden = true;
  const [name, arg] = location.hash.replace(/^#\/?/, '').split('/');
  const nav = { new: 'new', chart: 'library', edit: 'library', library: 'library', transit: 'transit', connect: 'connect', cycles: 'cycles', wissen: 'wissen', settings: 'settings' }[name || 'new'] || 'new';
  $$('.nav a').forEach(a => { if (a.dataset.r === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  ({ chart: viewChart, edit: viewEdit, library: viewLibrary, transit: viewTransit, connect: viewConnect, cycles: viewCycles, wissen: viewKnowledge, settings: viewSettings }[name] || viewHome)(arg);
  if (!keepScroll) window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; route(true); requestAnimationFrame(() => window.scrollTo(0, y)); }
function boot() {
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') { applyTheme(); rerender(); } });
  $$('.themes [data-th]').forEach(b => b.addEventListener('click', () => {
    if (effectiveTheme() === b.dataset.th && S.settings.theme !== 'system') return;
    S.settings.theme = b.dataset.th; saveSettings(); applyTheme(); rerender();
  }));
  initTooltips();
  window.addEventListener('hashchange', () => route());
  window.addEventListener('storage', e => { if (e.key === 'hds:library') S.lib = Store.get('library', []); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (/^#\/settings/.test(location.hash)) rerender(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; toast('App installiert'); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && $('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  route();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
